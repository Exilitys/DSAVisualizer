<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Graph browser verification probe</title>
<style>body{margin:0;font:12px system-ui}header{padding:8px;background:#eef0f7}button{min-height:36px;margin:2px}iframe{display:block;width:100%;height:calc(100vh - 130px);border:0}pre{margin:0;padding:6px;max-height:64px;overflow:auto}</style></head>
<body><header>
<button id="normal">Load application</button><button id="arm">Arm timings</button>
<button id="summary">Summarize timings</button><button id="lose">Lose WebGL context</button>
<button id="no-webgl">Load without WebGL</button>
<button id="cadence">Arm cadence</button><button id="cadence-summary">Read cadence</button>
<button id="orbit">Arm orbit frames</button><button id="orbit-summary">Read orbit frames</button><button id="restore">Simulate persisted pageshow</button>
<button id="hide">Hide test document</button><button id="show">Show test document</button>
<pre id="result" role="status">Ready</pre></header>
<iframe id="app" title="Application under test" src="/graph"></iframe>
<script>
const frame=document.getElementById('app');
const result=document.getElementById('result');
let samples=[];
let disarm=()=>{};
let ticks=[],stopCadence=()=>{};
document.getElementById('normal').onclick=()=>{disarm();frame.removeAttribute('srcdoc');frame.src='/graph';result.textContent='Normal application loaded';};
document.getElementById('arm').onclick=()=>{
  disarm();samples=[];
  const w=frame.contentWindow;
  const capture=event=>{
    if(!event.isTrusted || !event.target.closest('button,input'))return;
    const start=w.performance.now();
    const target=event.target.closest('button,input');
    const before=Number(w.document.querySelector('main')?.dataset.ordinal);
    const action=target.textContent || target.id;
    const expected=action.includes('Next')?before+1:action.includes('Previous')?before-1:null;
    w.requestAnimationFrame(()=>w.requestAnimationFrame(()=>samples.push({
      milliseconds:w.performance.now()-start,
      action,ordinal:w.document.querySelector('main')?.dataset.ordinal,
      selected:w.document.querySelector('main')?.dataset.selectedId,
      reflected:expected!==null?Number(w.document.querySelector('main')?.dataset.ordinal)===expected:
        !target.dataset.entityId || w.document.querySelector('main')?.dataset.selectedId===target.dataset.entityId
    })));
  };
  w.document.addEventListener('click',capture,true);
  disarm=()=>w.document.removeEventListener('click',capture,true);
  result.textContent='Armed. Perform ordinary application clicks.';
};
document.getElementById('summary').onclick=()=>{
  disarm();const ordered=samples.map(s=>s.milliseconds).sort((a,b)=>a-b);
  result.textContent=JSON.stringify({method:'trusted click capture to second animation frame',count:samples.length,
    p95:ordered[Math.ceil(ordered.length*.95)-1] ?? null,max:ordered.at(-1) ?? null,
    browser:frame.contentWindow.navigator.userAgent,samples});
};
document.getElementById('lose').onclick=()=>{
  const canvas=frame.contentDocument.querySelector('canvas');
  const gl=canvas?.getContext('webgl2');
  const extension=gl?.getExtension('WEBGL_lose_context');
  if(extension){extension.loseContext();result.textContent='Actual WebGL context loss requested';}
  else if(canvas){canvas.dispatchEvent(new Event('webglcontextlost',{cancelable:true}));result.textContent='Context loss event dispatched';}
  else result.textContent='No canvas to lose';
};
document.getElementById('no-webgl').onclick=()=>{
  disarm();
  frame.removeAttribute('srcdoc');
  frame.src='/__graph_no_webgl.html';
  result.textContent='WebGL creation disabled before application initialization';
};
document.getElementById('cadence').onclick=()=>{
  stopCadence();ticks=[];
  const w=frame.contentWindow, main=w.document.querySelector('main');
  let start=w.performance.now();
  const markStart=event=>{if(event.target.closest('button')?.textContent==='Play') start=w.performance.now();};
  w.document.addEventListener('click',markStart,true);
  const observer=new w.MutationObserver(records=>{
    if(records.some(r=>r.attributeName==='data-ordinal'))
      ticks.push({milliseconds:w.performance.now()-start,ordinal:main.dataset.ordinal,playing:main.dataset.playing});
  });
  observer.observe(main,{attributes:true});
  stopCadence=()=>{observer.disconnect();w.document.removeEventListener('click',markStart,true);};
  result.textContent='Cadence observer armed';
};
document.getElementById('cadence-summary').onclick=()=>{stopCadence();result.textContent=JSON.stringify(ticks);};
for(const [id,hidden] of [['hide',true],['show',false]])document.getElementById(id).onclick=()=>{
  const doc=frame.contentDocument;
  Object.defineProperty(doc,'hidden',{configurable:true,get:()=>hidden});
  doc.dispatchEvent(new frame.contentWindow.Event('visibilitychange'));
  result.textContent=hidden ? 'Test document hidden (simulated preference)' : 'Test document visible';
};

let frameIntervals=[],lastFrame=null,orbitActive=false;
document.getElementById('orbit').onclick=()=>{
  frameIntervals=[];lastFrame=null;orbitActive=true;
  const w=frame.contentWindow;
  const tick=t=>{if(!orbitActive)return;if(lastFrame!==null)frameIntervals.push(t-lastFrame);lastFrame=t;w.requestAnimationFrame(tick);};
  w.requestAnimationFrame(tick);result.textContent='Orbit frame observer armed; drag the scene now';
};
document.getElementById('orbit-summary').onclick=()=>{
  orbitActive=false;const ordered=[...frameIntervals].sort((a,b)=>a-b);
  result.textContent=JSON.stringify({method:'rAF intervals while trusted scene drag; proxy only',count:ordered.length,
    median:ordered[Math.floor(ordered.length/2)]??null,p95:ordered[Math.ceil(ordered.length*.95)-1]??null,max:ordered.at(-1)??null,intervals:frameIntervals});
};
document.getElementById('restore').onclick=()=>{
  frame.contentWindow.dispatchEvent(new frame.contentWindow.PageTransitionEvent('pageshow',{persisted:true}));
  result.textContent='Persisted pageshow simulated; the application should reload to resting';
};
</script></body></html>
